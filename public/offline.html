<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#3A1F6E">
    <title>Tiada sambungan · ASUH Digital</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
            background: #F7F5FF; color: #231F20; font-family: Nunito, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
        .card { max-width: 420px; width: 100%; background: #fff; border: 2px solid #231F20; border-radius: 24px; padding: 32px 24px; box-shadow: 0 4px 0 #231F20; }
        img { width: 72px; height: 72px; border-radius: 18px; }
        h1 { margin: 16px 0 8px; color: #C4107A; font-size: 26px; line-height: 1.2; }
        p { margin: 0 0 6px; line-height: 1.5; }
        .en { color: rgba(35, 31, 32, .7); font-size: 14px; }
        button { margin-top: 20px; min-height: 48px; padding: 0 28px; border: 2px solid #231F20; border-radius: 999px; background: #FFDE37;
            box-shadow: 0 3px 0 #231F20; font: inherit; font-weight: 800; font-size: 17px; color: #231F20; cursor: pointer; }
    </style>
</head>
<body>
    <main class="card">
        <img src="/icons/icon-192.png" alt="ASUH">
        <h1>Tiada sambungan internet</h1>
        <p>Semak Wi-Fi atau data telefon, kemudian cuba lagi.</p>
        <p class="en">No internet connection. Check your Wi-Fi or mobile data, then try again.</p>
        <button type="button" onclick="location.reload()">Cuba lagi · Try again</button>
    </main>
</body>
</html>
