# CI on every push to develop/main. From main, also build a ready-to-run
# release and publish it to the deploy-build branch.
#
# Deploying itself happens on the server: cPanel > Git Version Control pulls
# deploy-build and runs .cpanel.yml (scripts/deploy/cpanel-deploy.sh) when you
# click "Deploy HEAD Commit". The server is never reached from GitHub, so no
# SSH access or secrets are needed. See docs/DEPLOY.md.

name: CI dan deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Ujian dan raptai deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_sqlite, pdo_mysql, zip, bcmath, gd
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Build assets
        run: npm run build

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php vendor/bin/pest

      # Exercise the exact server-side path (.cpanel.yml -> cpanel-deploy.sh ->
      # activate-release.sh) on a fake cPanel account, so a broken script fails
      # here instead of on the real server.
      - name: Rehearse cPanel deploy and rollback
        run: |
          set -euo pipefail
          FAKE_HOME=/tmp/fakehome
          APP="$FAKE_HOME/asuh-app"
          DOCROOT="$FAKE_HOME/public_html/asuh.galeriilmu.com.my"
          CLONE="$FAKE_HOME/repositories/asuh-digital"
          mkdir -p "$APP/shared" "$DOCROOT" "$CLONE"

          cp .env.production.example "$APP/shared/.env"
          sed -i -e 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' \
                 -e "s#^DB_DATABASE=.*#DB_DATABASE=$FAKE_HOME/asuh.sqlite#" \
                 -e 's#^APP_URL=.*#APP_URL=http://localhost#' "$APP/shared/.env"
          touch "$FAKE_HOME/asuh.sqlite"
          echo "DEPLOY_PHP=$(command -v php)" > "$APP/shared/deploy.conf"

          # The docroot as cPanel leaves it: cgi-bin, .well-known and the
          # MultiPHP handler that selects PHP 8.3 (copied from the real server).
          mkdir -p "$DOCROOT/cgi-bin" "$DOCROOT/.well-known/acme-challenge"
          printf '\n\n# php -- BEGIN cPanel-generated handler, do not edit\n# Set the "ea-php83" package as the default "PHP" programming language.\n<IfModule mime_module>\n  AddHandler application/x-httpd-ea-php83 .php .php8 .phtml\n</IfModule>\n# php -- END cPanel-generated handler, do not edit\n' > "$DOCROOT/.htaccess"

          # What the deploy-build branch (and so the cPanel clone) will contain.
          bash scripts/deploy/package-release.sh /tmp/release.tgz
          tar -xzf /tmp/release.tgz -C "$CLONE"
          test -f "$CLONE/.cpanel.yml"
          test -d "$CLONE/vendor" && test -f "$CLONE/public/build/manifest.json"

          # Run the task line from .cpanel.yml, from the clone, twice.
          TASK="$(sed -n 's/^ *- //p' "$CLONE/.cpanel.yml")"
          for run in 1 2; do
            (cd "$CLONE" && HOME="$FAKE_HOME" bash -c "$TASK")
            sleep 1
          done

          releases=("$APP"/releases/*)
          test "${#releases[@]}" -eq 2
          test "$(readlink -f "$APP/current")" = "$(ls -d "$APP"/releases/* | sort | tail -n 1)"
          test -f "$DOCROOT/index.php"
          test ! -e "$APP/current/tests"
          grep -q '^APP_KEY=base64:' "$APP/shared/.env"
          test "$(stat -c %a "$APP/shared/.env")" = "600"
          ls -d "$DOCROOT".cpanel-original-*

          # The PHP 8.3 handler must survive both deploys, exactly once, at the top.
          for rel in "$APP"/releases/*; do
            test "$(grep -c 'application/x-httpd-ea-php83' "$rel/public/.htaccess")" -eq 1
          done
          grep -q 'RewriteEngine On' "$DOCROOT/.htaccess"
          head -n 1 "$DOCROOT/.htaccess" | grep -q 'BEGIN cPanel-generated handler'

          # A docroot .htaccess with hand-written rules must stop the deploy.
          ODD_HOME=/tmp/oddhome
          mkdir -p "$ODD_HOME/asuh-app" "$ODD_HOME/public_html/asuh.galeriilmu.com.my"
          cp -r "$APP/shared" "$ODD_HOME/asuh-app/shared"
          echo "Redirect 301 / https://example.com/" > "$ODD_HOME/public_html/asuh.galeriilmu.com.my/.htaccess"
          if (cd "$CLONE" && HOME="$ODD_HOME" bash -c "$TASK"); then
            echo "Deploy should have refused a docroot with custom rules"; exit 1
          fi
          test -f "$ODD_HOME/public_html/asuh.galeriilmu.com.my/.htaccess"

          first="$(ls -d "$APP"/releases/* | sort | head -n 1)"
          HOME="$FAKE_HOME" bash "$APP/current/scripts/deploy/rollback.sh" "$APP" "$(command -v php)"
          test "$(readlink -f "$APP/current")" = "$first"
          echo "cPanel deploy rehearsal passed."

  build:
    name: Bina release untuk cPanel
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql, zip, bcmath, gd
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Build production release
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      - name: Publish to the deploy-build branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/deploy/package-release.sh "$RUNNER_TEMP/release.tgz"
          bash scripts/deploy/publish-build-branch.sh "$RUNNER_TEMP/release.tgz" deploy-build
          echo "Next: cPanel > Git Version Control > Update from Remote > Deploy HEAD Commit" >> "$GITHUB_STEP_SUMMARY"
